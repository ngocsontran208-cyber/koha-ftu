    - additional_content_id: 1
      content:
      - Welcome to Koha. Koha is a full-featured open-source ILS. Developed initially
        in New Zealand by Katipo Communications Ltd and first deployed in January
        of 2000 for Horowhenua Library Trust, Koha is currently maintained by a team
        of software providers and library technology staff from around the globe.
      lang: default
      title: Welcome to Koha
    - additional_content_id: 2
      content:
      - 'Now that you''ve installed Koha, what''s next? Here are some suggestions:'
      - <ul>
      - <li><a href="https://koha-community.org/documentation/">Read Koha Documentation</a></li>
      - <li><a href="https://wiki.koha-community.org">Read/Write to the Koha Wiki</a></li>
      - <li><a href="https://koha-community.org/support/">Read and Contribute to Discussions</a></li>
      - <li><a href="https://bugs.koha-community.org">Report Koha Bugs</a></li>
      - <li><a href="https://wiki.koha-community.org/wiki/Version_Control_Using_Git">Submit
        Patches to Koha using Git (Version Control System)</a></li>
      - <li><a href="https://koha-community.org/support/">Chat with Koha users and
        developers</a></li>
      - </ul>
      - ''
      lang: default
      title: What's Next?

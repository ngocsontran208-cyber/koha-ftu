    - branchcode: ''
      code: ACCOUNTS_SUMMARY
      content:
      - '[% USE Branches %]'
      - '[% USE Koha %]'
      - '[% USE KohaDates %]'
      - '[% USE Price %]'
      - '[% PROCESS ''accounts.inc'' %]'
      - <table>
      - '  [% IF ( Koha.Preference(''LibraryName'') ) %]'
      - '    <tr>'
      - '      <th colspan=''4'' class=''centerednames''>'
      - '        <h1>[% Koha.Preference(''LibraryName'') | html %]</h1>'
